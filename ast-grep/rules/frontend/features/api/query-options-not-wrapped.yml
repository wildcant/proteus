id: query-options-not-wrapped
language: typescript
severity: error
message: This factory returns a bare object, so `useSuspenseQuery` cannot narrow its data from the key.
note: 'Wrap the body in `queryOptions({ … })` — or `infiniteQueryOptions` for a paged read. docs/query-hooks.md'
files:
  - "**/features/*/api/*.ts"
rule:
  any:
    - pattern: const $NAME = ($$$PARAMS) => ({ $$$BODY })
    - pattern: const $NAME = ($$$PARAMS) => { return { $$$BODY } }
constraints:
  NAME:
    regex: "QueryOptions$"
