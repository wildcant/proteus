id: form-hook-mutate-not-awaited
language: typescript
severity: error
message: This form hook fires `mutate()` and returns, so the form counts itself submitted while the request is still in the air.
note: 'Use `await $M.mutateAsync(...)` inside the submit''s try/catch. `isSubmitting` is true for exactly as long as `onSubmit` is pending, and it is the only thing `SubmitButton` reads — a fire-and-forget `mutate()` hands the button back mid-flight. ast-grep/rules/frontend/features/hooks/__docs__/form-hooks.md'
files:
  - "**/features/*/hooks/use-*form*.ts"
rule:
  kind: expression_statement
  has:
    pattern: $M.mutate($$$ARGS)
