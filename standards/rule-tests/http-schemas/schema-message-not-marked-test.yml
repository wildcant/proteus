id: schema-message-not-marked
valid:
  # Marked: the extractor finds it by name and the English sentence is the catalog id.
  - |
    export const StoreLoginBody = z.object({ password: password.min(1, i18n.t('Enter your password')) })
  - |
    const amount = z.string().regex(/^\d+$/, i18n.t('Invalid amount'))
  - |
    const numeric = z.string().refine((s) => s.length > 0, { error: i18n.t('Invalid numeric value') })
  # A message held in a constant was marked where the constant is declared.
  - |
    const tooLong = i18n.t('Use {maximum} characters or fewer')
    export const shortText = z.string().max(MAX_LENGTH.shortText, tooLong)
  # No message at all: Zod's default, re-rendered in the request's language at display.
  - |
    export const entityId = z.string().max(MAX_LENGTH.id)
  # Names, not messages.
  - |
    export const StoreCart = z.object({ id: z.string() }).openapi('StoreCart')
  - |
    const access = z.enum(['public', 'private'])
invalid:
  - |
    export const StoreLoginBody = z.object({ password: password.min(1, 'Enter your password') })
  - |
    const code = z.string().regex(/^[A-Za-z]{3}$/, 'Not an ISO 4217 currency code')
  - |
    const numeric = z.string().refine((s) => s.length > 0, 'Invalid numeric value')
  - |
    const country = countryCode.length(2, `Country is required`)
  - |
    const quantity = z.number().gte(1, 'Add at least one')
  # The params-object form.
  - |
    const numeric = z.string().refine((s) => s.length > 0, { error: 'Invalid numeric value' })
  - |
    const name = shortText.min(1, { message: 'Name is required' })
