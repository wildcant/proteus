id: omits-hook-errors
valid:
  # A workflow running the hook step spreads the hook into its own `throws`.
  - |
    export const createDraftOrderWorkflow = createWorkflow(
      { name: 'create-draft-order', throws: [ErrorTypes.NOT_FOUND, ...orderChargesHook.throws] },
      async (ctx, input) => {
        const charges = await hookStep(ctx, orderChargesHook, { cartId: input.cartId })
        return charges
      },
    )
  # The same, with the type arguments every real workflow has.
  - |
    export const createDraftOrderWorkflow = createWorkflow<Input, Output>(
      { name: 'create-draft-order', throws: [...orderChargesHook.throws] },
      async (ctx, input) => hookStep(ctx, orderChargesHook, { cartId: input.cartId }),
    )
  # A route previewing the hook outside a workflow spreads it into the running handler's own list.
  - |
    export const GetThrows = [ErrorTypes.NOT_FOUND, ...orderChargesHook.throws] as const
    export const PostThrows = [ErrorTypes.INVALID_DATA] as const
    export const GET = async (req) => runHook(req.scope, orderChargesHook, { cartId: req.params.id })
    export const POST = async (req) => ({ status: 201, json: {} })
invalid:
  # The hook step's errors are missing from the workflow's contract.
  - |
    export const createDraftOrderWorkflow = createWorkflow(
      { name: 'create-draft-order', throws: [ErrorTypes.NOT_FOUND] },
      async (ctx, input) => {
        const charges = await hookStep(ctx, orderChargesHook, { cartId: input.cartId })
        return charges
      },
    )
  # The spread sits in another workflow's `throws` in the same file.
  - |
    export const previewChargesWorkflow = createWorkflow(
      { name: 'preview-charges', throws: [...orderChargesHook.throws] },
      async (ctx, input) => ctx.step('noop', async () => input),
    )
    export const createDraftOrderWorkflow = createWorkflow(
      { name: 'create-draft-order', throws: [ErrorTypes.NOT_FOUND] },
      async (ctx, input) => hookStep(ctx, orderChargesHook, { cartId: input.cartId }),
    )
  # The spread sits in an unrelated array, not the workflow's `throws`.
  - |
    const documented = [...orderChargesHook.throws]
    export const createDraftOrderWorkflow = createWorkflow(
      { name: 'create-draft-order', throws: [ErrorTypes.NOT_FOUND], tags: [...orderChargesHook.throws] },
      async (ctx, input) => hookStep(ctx, orderChargesHook, { cartId: input.cartId }),
    )
  # Spreading another hook is not spreading this one.
  - |
    export const GetThrows = [...shippingQuoteHook.throws] as const
    export const GET = async (req) => runHook(req.scope, orderChargesHook, { cartId: req.params.id })
  # The route spreads it, but into another handler's list.
  - |
    export const PostThrows = [...orderChargesHook.throws] as const
    export const GetThrows = [ErrorTypes.NOT_FOUND] as const
    export const GET = async (req) => runHook(req.scope, orderChargesHook, { cartId: req.params.id })
