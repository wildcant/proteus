    const findRoleOrFail = async (accessControl: IAccessControlModuleService, id: string) => {
      const role = await accessControl.findRole(id)
      if (!role) throw new AppError({ type: ErrorTypes.NOT_FOUND, message: 'Role not found' })
      return role
    }
