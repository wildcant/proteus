  ? |
    export const w = createWorkflow('w', async (ctx, input) => {
      const check = await ctx.step('verify', async () => input.code)
      if (check.verified) {
        return check
      } else {
        return await ctx.step('resend', async () => check.email)
      }
    })
  : labels:
