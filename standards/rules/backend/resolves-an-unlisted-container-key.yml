id: resolves-an-unlisted-container-key
language: typescript
severity: error
message: This resolves a container key that is not a `Modules`, `ContainerRegistrationKeys` or extension keys (`<Pascal>Modules`) member. Name the key on one of them.
note: 'The shared container is keyed by `Modules` (`core/utils/modules-definition.ts`) and `ContainerRegistrationKeys` (`core/utils/container.ts`). A literal or a locally declared alias spells the same key a second time, so a rename reaches the registration and leaves the read, and the failure surfaces at runtime as `AwilixResolutionError` rather than at `pnpm run typecheck`. An extension keys its modules on its own object in `<ext>/keys.ts` — `export const PisosDjModules = { SHIPPING: defineModuleKey<IShippingService>(''pisos-dj.shipping'') }` — recognised by the `<Pascal>Modules` name, since core''s closed list is not the extension''s to edit. This matches the *argument* rather than the string, because the alias — `const ACCESS_CONTROL_MODULE_KEY = ''access-control''` then `resolve(ACCESS_CONTROL_MODULE_KEY)` — passes an identifier and a search for `resolve(''` sees none of them. docs/container-resolution.md'
files:
  - "apps/backend/src/**/*.ts"
  - "apps/backend/tests/extension-fixture/**/*.ts"
ignores:
  # Tests register their own keys — `greeting`, a provider id — into throwaway containers.
  - "**/__tests__/**"
  # A provider service resolves the key it computed from a provider id, which no enum can list.
  - "**/src/modules/*/services/*-provider-service.ts"
  # A loader reads the repositories it is about to hand to a service out of the module's own
  # private container, under keys that exist only inside that module.
  - "**/src/modules/*/loaders/*.ts"
  - "**/{src/extensions,tests/extension-fixture}/*/modules/*/loaders/*.ts"
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: member_expression
        all:
          - has:
              field: property
              regex: '^resolve$'
          # `path.resolve` and `Promise.resolve` are not container reads.
          - has:
              field: object
              regex: '(?i)(container|scope|cradle)$'
    - not:
        has:
          field: arguments
          has:
            any:
              - pattern: Modules.$MEMBER
              - pattern: ContainerRegistrationKeys.$MEMBER
              # An extension's keys object, `FixtureModules.NOTES`: built with `defineModuleKey`, so the
              # key carries its service's type and a rename reaches every read.
              - kind: member_expression
                all:
                  - has:
                      field: object
                      kind: identifier
                      regex: '^[A-Z][A-Za-z0-9]*Modules$'
                  - has:
                      field: property
                      regex: '^[A-Z][A-Z0-9_]*$'
