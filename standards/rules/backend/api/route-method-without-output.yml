id: route-method-without-output
language: typescript
severity: error
message: 'This handler co-exports no matching `Output` constant — `GET` needs `GetOutput`, `POST` needs `PostOutput` — so its definition has no response schema to forward.'
note: 'Add it beside the handler: `export const GetOutput = AdminCustomersResponse`. The definition file forwards the constant by name (`output: customerRoutes.GetOutput`), which is what lets `route.ts` and `definitions.ts` say the same thing without either restating it, and `Promise<HttpResult<typeof GetOutput>>` is what types the handler''s return. The schema itself always comes from `@proteus/http-schemas`. standards/rules/backend/api/__docs__/routes.md'
files:
  - "**/src/api/**/route.ts"
ignores:
  - "**/__tests__/**"
# One branch per method, because ast-grep metavariables do not case-transform and so cannot bind
# `GET` in the export and `Get` in the constant it requires. Scope is the file, not the position:
# the `Output` may sit anywhere in `program`, which is how the constants above the handlers and the
# ones between them both satisfy it.
rule:
  any:
    - all:
        - pattern: export const GET = $HANDLER
        - not:
            inside:
              kind: program
              stopBy: end
              has:
                stopBy: end
                pattern: export const GetOutput = $OUT
    - all:
        - pattern: export const POST = $HANDLER
        - not:
            inside:
              kind: program
              stopBy: end
              has:
                stopBy: end
                pattern: export const PostOutput = $OUT
    - all:
        - pattern: export const PATCH = $HANDLER
        - not:
            inside:
              kind: program
              stopBy: end
              has:
                stopBy: end
                pattern: export const PatchOutput = $OUT
    - all:
        - pattern: export const PUT = $HANDLER
        - not:
            inside:
              kind: program
              stopBy: end
              has:
                stopBy: end
                pattern: export const PutOutput = $OUT
    - all:
        - pattern: export const DELETE = $HANDLER
        - not:
            inside:
              kind: program
              stopBy: end
              has:
                stopBy: end
                pattern: export const DeleteOutput = $OUT
