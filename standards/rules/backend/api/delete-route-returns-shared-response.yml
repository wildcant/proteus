id: delete-route-returns-shared-response
language: typescript
severity: error
message: 'This DELETE answers with `$OUT` rather than the shared `DeleteResponse`, so one endpoint describes a deletion differently from the other sixteen.'
note: 'Use `DeleteResponse` — `{ id, deleted }` — from `@proteus/http-schemas`. A per-resource variant becomes its own schema in the OpenAPI document and its own generated model, so a client that handles deletions cannot handle them uniformly. If the resource genuinely needs to say more, that is a decision to take deliberately and suppress here by id with the reason. apps/backend/src/api/README.md'
files:
  - "**/src/api/**/route.ts"
ignores:
  - "**/__tests__/**"
rule:
  pattern: export const DeleteOutput = $OUT
constraints:
  OUT:
    not:
      regex: '^DeleteResponse$'
