id: route-declares-helper-function
language: typescript
severity: error
message: '`$NAME` is a helper declared in a route file, where nothing else can reach it. A handler calls out; it does not carry its own helpers.'
note: 'Place it by what it touches: pure shaping goes to `src/workflows/<domain>/utils/`, service calls go behind a method on that module''s service, and anything reading `req` is either a guard clause that stays inline or — once a second route needs it — a `MiddlewareFunction` in `middlewares.ts`. A read chain crossing modules stays inline however long it runs; there is nothing to unwind, so there is nothing to extract it for. standards/rules/backend/api/__docs__/route-helpers.md'
files:
  - "**/src/api/**/route.ts"
ignores:
  - "**/__tests__/**"
# Two shapes a helper takes in a route file:
#
# 1. `function_declaration` — handlers are `export const GET = async (req) => …`, never
#    `function GET()`, so every `function_declaration` in these files is a helper.
#
# 2. Non-exported `const` arrow — `const shape = (rows) => …`. Exported arrows are either
#    handlers or the `Input`/`Output`/`Throws`/`Middlewares` constants the file must carry.
#    Non-exported non-arrow consts (lookup tables like `const MAP: Record<…> = { … }`) are
#    data, not helpers.
#
# Both are scoped to file-level: a lambda inside a handler (e.g. `rows.map((r) => r.id)`)
# is not matched because it sits inside an `arrow_function`.
rule:
  any:
    - kind: function_declaration
      has:
        field: name
        pattern: $NAME
    - kind: variable_declarator
      all:
        - has:
            field: name
            pattern: $NAME
        - has:
            field: value
            kind: arrow_function
        - not:
            inside:
              kind: export_statement
              stopBy: end
        - not:
            inside:
              kind: arrow_function
              stopBy: end
        - not:
            inside:
              kind: function_declaration
              stopBy: end
