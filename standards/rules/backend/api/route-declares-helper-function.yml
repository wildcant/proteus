id: route-declares-helper-function
language: typescript
severity: error
message: '`$NAME` is a helper declared in a route file, where nothing else can reach it. A handler calls out; it does not carry its own helpers.'
note: 'Place it by what it touches: pure shaping goes to `src/workflows/<domain>/utils/`, service calls go behind a method on that module''s service, and anything reading `req` is either a guard clause that stays inline or — once a second route needs it — a `MiddlewareFunction` in `middlewares.ts`. A read chain crossing modules stays inline however long it runs; there is nothing to unwind, so there is nothing to extract it for. apps/backend/src/api/README.md'
files:
  - "**/src/api/**/route.ts"
ignores:
  - "**/__tests__/**"
# Handlers are `export const GET = async (req) => …`, never `function GET()`, so a
# `function_declaration` in one of these files is always the helper and never the thing the file is
# for. That is what lets this rule be a bare kind check rather than a name list: it does not have to
# tell a helper from a handler, because handlers are not written this way.
#
# The arrow form of a helper — `const shape = (rows) => …` — is not matched, and deliberately.
# Excluding the five handler names means matching every remaining arrow at file scope, which reaches
# past helpers to the `Input`/`Output`/`Throws` constants the file is required to export. The
# function form is where the helpers this rule was written for actually appeared.
rule:
  kind: function_declaration
  has:
    field: name
    pattern: $NAME
