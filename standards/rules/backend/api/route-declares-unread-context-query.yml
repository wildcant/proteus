id: route-declares-unread-context-query
language: typescript
severity: error
message: 'This route declares `contextQuery: StorePricingContextParams` but no `<Method>Middlewares` runs `setPricingContext()`, so `countryCode` and `cartId` are documented and then ignored.'
note: 'Add the middleware that reads them: `export const PostMiddlewares = [setPricingContext()] as const`. `contextQuery` has no runtime effect of its own — it declares, for the OpenAPI document, a query param that a middleware consumes. A second context middleware brings its own pair of rules rather than widening these.'
files:
  - "**/src/api/**/route.ts"
ignores:
  - "**/__tests__/**"
rule:
  pattern:
    context: "const o = { contextQuery: StorePricingContextParams }"
    selector: pair
  not:
    inside:
      kind: program
      stopBy: end
      has:
        stopBy: end
        pattern: setPricingContext()
