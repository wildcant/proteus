id: wraps-another-method
language: typescript
severity: error
message: This method's whole body forwards its arguments to another method of the same class. Delete it and call that one.
note: 'A method that only re-emits a call under a second name adds a second thing to keep in step and a second name for readers to reconcile — `listGrantedPermissionKeys` forwarding to `resolveEffectiveFeatures` is what made a middleware hand-write a type for a service it could have named. Rename the inner method if the outer name is the better one. Forwarding that *binds* an argument does work: `listUserRoles(userId, context)` calling `this.listActorRoles(''user'', userId, context)` is the actor-type-is-user decision, which is why this matches only a body whose arguments are the bare identifiers it was handed. docs/service-contracts.md'
files:
  - "apps/backend/src/**/*.ts"
ignores:
  # A fake in a test forwards to its own recorder by design.
  - "**/__tests__/**"
rule:
  kind: method_definition
  has:
    field: body
    kind: statement_block
    all:
      - has:
          kind: return_statement
          nthChild: 1
          has:
            kind: call_expression
            all:
              - has:
                  field: function
                  kind: member_expression
                  has:
                    field: object
                    kind: this
              # Bare identifiers only: a literal or an expression is a decision this method made.
              - has:
                  field: arguments
                  regex: '^\(([A-Za-z_$][A-Za-z0-9_$]*(, ?[A-Za-z_$][A-Za-z0-9_$]*)*)?\)$'
      # And nothing else in the body — a second statement is behaviour of its own.
      - not:
          has:
            nthChild: 2
