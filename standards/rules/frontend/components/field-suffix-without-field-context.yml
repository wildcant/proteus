id: field-suffix-without-field-context
language: tsx
severity: error
message: This component is named `*Field` but reads no `useFieldContext()`. The suffix is reserved for registered form fields.
note: 'The `Field` suffix is a type signal: `form.AppField`''s children are exactly the components registered under `fieldComponents` in `src/lib/form-hook.ts`, and every one of them reads its state from `useFieldContext()`. A control that owns its own state cannot be passed there, so name it for what it is — `*Form`, `*Input`, `*Picker`. standards/rules/frontend/components/__docs__/form-components.md'
files:
  - "**/src/**/*.tsx"
utils:
  FIELD_NAME:
    regex: '^[A-Z][A-Za-z0-9]+Field$'
rule:
  all:
    - any:
        - kind: function_declaration
          has: { field: name, matches: FIELD_NAME }
        - kind: variable_declarator
          all:
            - has: { field: name, matches: FIELD_NAME }
            - has:
                field: value
                any:
                  - kind: arrow_function
                  - kind: function_expression
    - not:
        has:
          stopBy: end
          kind: call_expression
          has:
            field: function
            regex: '^useFieldContext$'
