id: submit-button-not-from-form-hook
language: tsx
severity: error
message: This submit is a raw Button. The form hook registers a `SubmitButton`; use that one.
note: 'Reach it as `<form.AppForm><form.SubmitButton>…</form.SubmitButton></form.AppForm>`. It takes no props but its own appearance: no `disabled`, which is what keeps a submit from being gated on validity, and no in-flight flag either — it subscribes to `isSubmitting`, which the form hook''s awaited submit makes truthful. standards/rules/frontend/components/__docs__/form-components.md'
files:
  - "**/src/**/*.tsx"
ignores:
  # The component itself, and the only place a raw submit Button belongs.
  - "**/src/components/form/submit-button.tsx"
  # No `useAppForm` behind this one — the price grid is `useState`, so there is no form context for
  # `form.SubmitButton` to read. A whole file rather than the one line because a JSX match cannot
  # carry an inline suppression; see standards/README.md.
  - "**/variant/variant-price-edit-form.tsx"
utils:
  IS_SUBMIT:
    kind: jsx_attribute
    regex: '^type="submit"$'
rule:
  any:
    - kind: jsx_element
      has:
        kind: jsx_opening_element
        has: { matches: IS_SUBMIT }
    - kind: jsx_self_closing_element
      has: { matches: IS_SUBMIT }
