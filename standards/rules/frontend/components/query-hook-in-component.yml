id: query-hook-in-component
language: tsx
severity: error
message: "Don't import `@tanstack/react-query` here. Query hooks and options belong in `features/{name}/api/`."
note: 'All React Query usage lives in `features/{name}/api/{name}.ts`. Components and route files call custom hooks from that layer. standards/rules/frontend/features/api/__docs__/query-hooks.md'
files:
  - "**/src/**/*.tsx"
  - "**/src/**/*.ts"
ignores:
  - "**/features/*/api/**"
  - "**/src/lib/query-client.ts"
  - "**/src/lib/query-key-factory.ts"
  - "**/src/routes/__root.tsx"
  - "**/src/router.tsx"
  - "**/*.test.tsx"
  - "**/*.test.ts"
rule:
  pattern: import $$$IMPORTS from '@tanstack/react-query'
