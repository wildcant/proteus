# Standards — what a file's contents must look like, the counterpart to the dependency rules
# in each app's `structure/.dependency-cruiser.cjs`. Both are declarative — these run in the
# `standards` gate of `pnpm verify`, those in `structure`.
#
# `rules/` mirrors the code it governs, so a rule has an obvious home: frontend/features/api holds
# the mutation-hook contract, backend/workflows would hold the step rules. See standards/README.md
# for the tree and for how to add one.
#
# Rules and tests are both discovered recursively. Snapshots are not — ast-grep keys those by rule
# id, so they stay flat in `rule-tests/__snapshots__/`.
ruleDirs:
  - standards/rules
testConfigs:
  - testDir: standards/rule-tests
# Sub-rules shared by more than one rule, referenced with `matches:`. Discovered recursively, so
# they mirror `rules/`. What lives here is a *fragment* — the shape of a `ctx.step` call, say —
# never a standard of its own: a util has no `severity` and reports nothing on its own.
utilDirs:
  - standards/utils
