# The one hand-written file in this directory. `openapi-admin.json` and
# `openapi-store.json` beside it are generated by `pnpm openapi:generate` —
# never edit those by hand; edit the routes and schemas they are built from.
#
# Run with: pnpm --filter backend run check:openapi

extends: ["spectral:oas"]

rules:
  # ---- spectral:oas tuning -------------------------------------------------
  # Every operation carries a summary; a second prose description is noise in a
  # spec generated from Zod.
  operation-description: off
  oas3-parameter-description: off
  operation-tag-defined: error
  info-contact: off
  info-description: error

  # ---- Regression guards --------------------------------------------------

  paths-kebab-case:
    description: Path segments must be kebab-case.
    message: "{{property}} must be kebab-case"
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^(/[a-z0-9]+(-[a-z0-9]+)*|/\\{[a-zA-Z0-9]+\\})+$"

  camel-case-properties:
    description: Schema properties must be camelCase.
    message: "{{property}} is not camelCase"
    severity: error
    given: "$.components.schemas..properties.*~"
    then:
      function: casing
      functionOptions:
        type: camel

  camel-case-operation-id:
    description: operationId becomes the generated Orval client function name.
    severity: error
    given: "$.paths[*][get,post,put,patch,delete].operationId"
    then:
      function: casing
      functionOptions:
        type: camel

  timestamps-are-iso:
    description: "A property ending in `At` must serialize as an ISO date-time string."
    message: "{{path}} must be a string with format date-time"
    severity: error
    given: "$.components.schemas..properties[?(@property.match(/At$/))]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: ["format"]
          properties:
            format:
              const: date-time

  no-verbs-in-paths:
    description: Paths name resources, not actions. Use the HTTP method for the verb.
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        notMatch: "/(get|create|update|delete|list|add|remove|set|fetch)(/|$)"

  schema-properties-must-have-type:
    description: An untyped property generates `unknown` in the Orval client.
    message: "{{path}} has no type"
    severity: error
    given: "$.components.schemas..properties[*]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          anyOf:
            - required: ["type"]
            - required: ["$ref"]
            - required: ["allOf"]
            - required: ["anyOf"]
            - required: ["oneOf"]
            - required: ["enum"]
            - required: ["const"]

  security-schemes-defined:
    description: The API uses JWT auth but the spec documents no security schemes.
    severity: error
    given: "$"
    then:
      field: "components.securitySchemes"
      function: truthy

  # `defined`, not `truthy`: a public operation declares `security: []`, and an
  # empty array is falsy. The empty array is the point — it says "no auth
  # required" explicitly rather than by omission — so the rule asserts the field
  # is present, not that it is non-empty.
  operation-security-defined:
    description: Every operation must declare its security requirement — `[]` for public routes.
    severity: error
    given: "$.paths[*][get,post,put,patch,delete]"
    then:
      field: security
      function: defined

  # Scoped to operations that actually require a credential. The unscoped form
  # selects every operation's `responses`, including public ones that cannot
  # send a 401 — and ILLO-77 forbids documenting a response the API never
  # sends. The filter runs over each path item's children, so it selects
  # operations whose `security` is non-empty; a public operation carries
  # `security: []` and is skipped.
  authed-operations-document-401:
    description: An authenticated operation must document its 401.
    severity: error
    given: "$.paths[*][?(@.security && @.security.length > 0)].responses"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: ["401"]

  # ---- Input bounds -------------------------------------------------------

  # OWASP api4 scoped to REQUEST bodies only — unbounded input is the DoS surface;
  # bounding response strings is busywork. Unscoped, this rule reports 805 findings.
  #
  # The bounds these two rules ask for are not written per field: `@proteus/http-schemas`
  # names a primitive per kind (`shortText`, `entityId`, `httpUrl`, ...) and the schemas
  # substitute it, so a new field picks a kind rather than inventing a number.
  request-strings-are-bounded:
    description: A string accepted from a client must declare maxLength (or enum/const/format).
    severity: error
    given: "$.paths[*][post,put,patch].requestBody.content[*].schema..properties[?(@.type=='string')]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          anyOf:
            - required: ["maxLength"]
            - required: ["enum"]
            - required: ["const"]
            - required: ["format"]

  request-arrays-are-bounded:
    description: An array accepted from a client must declare maxItems.
    severity: error
    given: "$.paths[*][post,put,patch].requestBody.content[*].schema..properties[?(@.type=='array')]"
    then:
      field: maxItems
      function: defined
