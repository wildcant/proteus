# Store structure for the development catalogue in product-import.csv. `fields` are the product
# metafields the rules read; `filterable: true` also offers one as a storefront filter. `source: vendor`
# makes a field the product's brand, the CSV's Vendor column, and `source: type` its Product Type, the
# Type column, instead of a metafield. A rule maps each key to the values that satisfy it: every key
# must match, each by any one of its values. A category may add a `heading`, its page's title when it
# should read differently from the menu's name.
#
# A menu entry may open a panel of `sections` instead of its children, each one of:
#   - name: Styles
#     show: subcategories                  # the entry's child categories, then "View all"
#   - name: Brands
#     show: { values: marca, limit: 8 }    # each value of a field among the entry's products
#   - name: Brands
#     show: { values: modelo, groupBy: marca, groups: 6, limit: 6 }
#                                          # one column per brand with its models, most products first
#   - name: Size
#     show: { option: Size }               # the sizes the entry's products offer, as chips
#   - name: Featured
#     links:                               # fixed links
#       - { name: Tops, filter: { tipo: [tops] } }   # the entry's list, filtered
#       - { collection: featured }                   # or a category or collection
# Any section may add a `note`, a line of text under it, and an entry may add `footer`, links in the
# same shape as `links` set apart below its sections.
#
# `search` is what search offers before a term finds anything: `popular` terms and `trending` models,
# each a list filtered as a link is. `filters` names the storefront's filters in the order it shows
# them: a field's key or `option.<Title>`.
#
# A collection may add a `badge`, which its members' list cards wear (`badge: new`). `options` names
# product options by title: `role` is the part one plays on the list card — `grouping`, its values
# each have their own look and photo; `availability`, the card lists its in-stock values — and
# `buckets` are what its filter offers in place of its raw values, each value joining every bucket
# holding one of its words. A `swatch` is free text the storefront draws from (a hex, an image URL, a
# key):
#   - name: Color
#     role: grouping
#     buckets:
#       - { name: Black, swatch: black, words: [black, onyx] }
#
# `card.subline` is the line under a list card's title, a template: `{type}`, `{brand}` or a field's
# `{<key>}`, `|lower` to lower-case it, segments split at " · " that vanish when a placeholder in them is
# empty. `card.listSeparator` joins a field's several values (default ", "):
#   card:
#     subline: "{type} · {genero}"
#     listSeparator: " and "
fields:
  - name: Género
    key: genero
    filterable: true
  - name: Tipo
    key: tipo
    filterable: true
  - name: Colecciones
    key: colecciones
  - { name: Marca, key: marca, source: vendor, filterable: true }
  - name: Modelo
    key: modelo
categories:
  - name: Men
    handle: men
    rule: { genero: [men] }
    children:
      - name: Tops
        handle: men-tops
        rule: { genero: [men], tipo: [tops] }
      - name: Bottoms
        handle: men-bottoms
        rule: { genero: [men], tipo: [bottoms] }
      - name: Shoes
        handle: men-shoes
        rule: { genero: [men], tipo: [shoes] }
  - name: Women
    handle: women
    rule: { genero: [women] }
    children:
      - name: Tops
        handle: women-tops
        rule: { genero: [women], tipo: [tops] }
      - name: Bottoms
        handle: women-bottoms
        rule: { genero: [women], tipo: [bottoms] }
  - name: Unisex
    handle: unisex
    rule: { genero: [unisex] }
    children:
      - name: Tops
        handle: unisex-tops
        rule: { genero: [unisex], tipo: [tops] }
      - name: Bottoms
        handle: unisex-bottoms
        rule: { genero: [unisex], tipo: [bottoms] }
      - name: Shoes
        handle: unisex-shoes
        rule: { genero: [unisex], tipo: [shoes] }
      - name: Accessories
        handle: unisex-accessories
        rule: { genero: [unisex], tipo: [accessories] }
  - name: Shoes
    handle: shoes
    heading: All shoes
    rule: { tipo: [shoes] }
collections:
  - name: Featured
    handle: featured
    rule: { colecciones: [featured] }
  - name: Essentials
    handle: essentials
    rule: { colecciones: [essentials] }
  - name: Active
    handle: active
    rule: { colecciones: [active] }
options:
  - name: Color
    role: grouping
  - name: Size
    role: availability
menu:
  - category: men
    sections:
      - { name: Category, show: subcategories }
      - name: Size
        show: { option: Size }
        note: Only what comes in your size.
  - category: women
    sections:
      - { name: Category, show: subcategories }
      - name: Size
        show: { option: Size }
        note: Only what comes in your size.
  - category: shoes
    sections:
      - name: All shoes
        links:
          - { name: Men's shoes, category: men-shoes }
          - { name: Unisex shoes, category: unisex-shoes }
          - { collection: active }
      - name: Brands
        show: { values: modelo, groupBy: marca, groups: 6, limit: 6 }
    footer:
      - { name: All brands, category: shoes }
  - category: unisex
  - collection: featured
search:
  popular: [hoodie, sneakers, puffer]
  trending:
    - { name: Tops, filter: { tipo: [tops] }, note: T-shirts and hoodies }
    - { name: Shoes, filter: { tipo: [shoes] } }
filters: [genero, tipo, marca, option.Size]
