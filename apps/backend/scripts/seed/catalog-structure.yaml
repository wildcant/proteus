# Store structure for the development catalogue in product-import.csv. `campos` are the product
# metafields the rules read. A rule maps each clave to the values that satisfy it: every clave must
# match, each by any one of its values.
campos:
  - nombre: Género
    clave: genero
  - nombre: Tipo
    clave: tipo
  - nombre: Colecciones
    clave: colecciones
categorias:
  - nombre: Men
    handle: men
    regla: { genero: [men] }
    hijos:
      - nombre: Tops
        handle: men-tops
        regla: { genero: [men], tipo: [tops] }
      - nombre: Bottoms
        handle: men-bottoms
        regla: { genero: [men], tipo: [bottoms] }
      - nombre: Shoes
        handle: men-shoes
        regla: { genero: [men], tipo: [shoes] }
  - nombre: Women
    handle: women
    regla: { genero: [women] }
    hijos:
      - nombre: Tops
        handle: women-tops
        regla: { genero: [women], tipo: [tops] }
      - nombre: Bottoms
        handle: women-bottoms
        regla: { genero: [women], tipo: [bottoms] }
  - nombre: Unisex
    handle: unisex
    regla: { genero: [unisex] }
    hijos:
      - nombre: Tops
        handle: unisex-tops
        regla: { genero: [unisex], tipo: [tops] }
      - nombre: Bottoms
        handle: unisex-bottoms
        regla: { genero: [unisex], tipo: [bottoms] }
      - nombre: Shoes
        handle: unisex-shoes
        regla: { genero: [unisex], tipo: [shoes] }
      - nombre: Accessories
        handle: unisex-accessories
        regla: { genero: [unisex], tipo: [accessories] }
colecciones:
  - nombre: Featured
    handle: featured
    regla: { colecciones: [featured] }
  - nombre: Essentials
    handle: essentials
    regla: { colecciones: [essentials] }
  - nombre: Active
    handle: active
    regla: { colecciones: [active] }
menu:
  - categoria: men
  - categoria: women
  - categoria: unisex
