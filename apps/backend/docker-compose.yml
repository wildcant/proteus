services:
  postgres:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proteus
    volumes:
      - proteus-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 10

  # A second way in to the same Postgres, for making the API behave like its database is not on
  # localhost. The proxy passes traffic through untouched until `npm run dev:slow` adds a latency
  # toxic — toxiproxy's config file can declare proxies but not toxics, so that part is a curl.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ['-host=0.0.0.0', '-config=/config/toxiproxy.json']
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      # Control API, then the slow Postgres.
      - '8474:8474'
      - '5442:5442'
    depends_on:
      postgres:
        condition: service_healthy

  # Temporal shares the postgres service above rather than bringing its own: one database server,
  # three databases (`proteus`, `temporal`, `temporal_visibility`). Its two are created and migrated
  # by `temporal-schema` below — `temporalio/server` does none of that itself, which is the whole
  # reason there are three services here where there used to be one. The deprecated
  # `temporalio/auto-setup` image did it in-process on first boot.
  #
  # The shape is the official one from
  # https://github.com/temporalio/samples-server/tree/main/compose, with the sample's own
  # `temporal-postgresql` service dropped: schema setup runs to completion, then the server boots,
  # then the `default` namespace is registered.
  #
  # `npm run db:reset` only drops `proteus`, so workflow history survives a database reset —
  # `npm run stack:reset` is what wipes it, along with everything else in the volume.
  temporal-schema:
    image: temporalio/admin-tools:1.31.2
    restart: on-failure:6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      # `temporal-sql-tool` takes the password from SQL_PASSWORD; POSTGRES_PWD is the server's.
      SQL_PASSWORD: postgres
    volumes:
      - ./scripts/temporal/compose:/scripts:ro
    # `temporalio/admin-tools` has no /bin/bash. This has to be /bin/sh.
    entrypoint: ['/bin/sh']
    command: /scripts/setup-postgres.sh

  temporal:
    image: temporalio/server:1.31.2
    ports:
      - '7233:7233'
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: 0.0.0.0
      # Resolved under /etc/temporal, where the mount below lands. The server exits at startup
      # without this file and the image does not ship one.
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy
      temporal-schema:
        condition: service_completed_successfully
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      # This image is one binary plus busybox — there is no `temporal` CLI inside it to ask for
      # cluster health the way auto-setup allowed. The port is all it can answer. The stronger
      # question is asked by `temporal-create-namespace`, which polls `operator cluster health`
      # before it does anything, so depending on *that* completing is how the rest of the stack
      # waits for SERVING.
      test: ['CMD', 'nc', '-z', 'localhost', '7233']
      interval: 5s
      timeout: 5s
      retries: 12
      # Migration is `temporal-schema`'s job now, so there is much less to do before the frontend
      # listens — the old 30s was auto-setup migrating two schemas before it started serving.
      start_period: 10s

  # The server does not register `default`; a clean boot has only `temporal-system`. Everything in
  # this repo connects to `default`, so the services that talk to Temporal wait on this one having
  # completed rather than on `temporal` being healthy.
  temporal-create-namespace:
    image: temporalio/admin-tools:1.31.2
    restart: on-failure:6
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    volumes:
      - ./scripts/temporal/compose:/scripts:ro
    entrypoint: ['/bin/sh']
    command: /scripts/create-namespace.sh

  temporal-ui:
    image: temporalio/ui:2.53.3
    ports:
      - '8088:8080'
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8088
    depends_on:
      postgres:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # What makes `npm run dev` work with no extra setup. `RUNTIME` defaults to `node`, so
  # `engine-selection.ts` resolves the Temporal engine and every `createWorkflow(...).run()` becomes
  # a task on the `proteus` queue. Nothing polling that queue is not an error — `workflow.execute`
  # has no execution timeout, so the HTTP request simply never returns. This is what polls it.
  #
  # Iterating on workflow or Worker code means running it on the host instead: `worker:dev` is the
  # same entrypoint under `tsx --watch`, so an edit restarts it in ~5s rather than by hand. Stop this
  # service first — both poll `proteus`, and whichever is free claims the task. The VS Code `dev`
  # task does that stop for you.
  #
  # Watch mode deliberately does not live in here. The bind mount below carries host writes into the
  # container, but not the filesystem events that a watcher needs, so `--watch` in this service would
  # look like it worked and then never fire.
  worker:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
    environment:
      # dotenvx leaves an already-set variable alone, so these win over `.env.local` without
      # `--overload`. Both addresses are the same services the host reaches on localhost; inside the
      # network they are service names.
      POOLER_DATABASE_URL: postgres://postgres:postgres@postgres:5432/proteus
      DIRECT_DATABASE_URL: postgres://postgres:postgres@postgres:5432/proteus
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      # The Worker resolves the same secrets the API does, and reads them the same way — `npm run
      # setup` (specifically `pull-keys`) has to have produced `.env.keys`, exactly as it must for
      # `npm run dev`.
      - ../../.env.local:/app/.env.local:ro
      - ../../.env.keys:/app/.env.keys:ro
      # Source only. `node_modules` stays the image's, because `@temporalio/core-bridge` is a native
      # addon and the host's build is for the host's platform.
      - ./src:/app/apps/backend/src:ro
      - ../../packages:/app/packages:ro
      # `upload-files` writes through the localfs provider in dev, and the API serves what it wrote.
      # Without this the two disagree about where the file went.
      - ./static:/app/apps/backend/static
    healthcheck:
      # Asks Temporal whether the queue has a poller, rather than whether a process exists — a
      # Worker that booted and failed to connect is exactly the case the second one misses.
      test: ['CMD', 'npm', 'run', '--workspace=backend', '--silent', 'temporal:worker-ready']
      interval: 5s
      timeout: 20s
      retries: 12
      # The workflow bundle is a webpack pass over the sandbox entrypoint, so the first probe is
      # late rather than slow — the same reason `temporal` above needs one.
      start_period: 60s

volumes:
  proteus-dev-data:
